<!DOCTYPE html>
<html><head><meta charset="utf-8">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>WatchPanel player</title>
<style>html,body{margin:0;height:100%;background:#000}iframe{border:0;width:100%;height:100%}</style></head>
<body><script>
var v=(location.search.match(/[?&]v=([\w-]{11})/)||[])[1];
if(v){var f=document.createElement('iframe');
f.allow='autoplay; encrypted-media; fullscreen; picture-in-picture';f.allowFullscreen=true;
f.src='https://www.youtube.com/embed/'+v+'?autoplay=1&rel=0&modestbranding=1&origin='+encodeURIComponent(location.origin);
document.body.appendChild(f);}
</script></body></html>
