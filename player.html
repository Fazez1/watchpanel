<!DOCTYPE html>
<html><head><meta charset="utf-8">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>WatchPanel player</title>
<style>
html,body{margin:0;height:100%;background:#000;overflow:hidden;font-family:system-ui,sans-serif}
#p{position:absolute;inset:0;width:100%;height:100%;border:0}
#msg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:16px;color:#cfd3ee;font-size:13px;line-height:1.5;pointer-events:none}
</style></head>
<body>
<div id="p"></div>
<div id="msg">Loading player…</div>
<script>
var msg=document.getElementById('msg');
function say(t){msg.style.display='flex';msg.textContent=t;}
var v=(location.search.match(/[?&]v=([\w-]{11})/)||[])[1];
var errs={2:'Invalid video ID.',5:'The player hit an HTML5 error.',100:'Video not found or private.',
101:'The owner turned off embedding for this video. Use “Open in browser”.',
150:'The owner turned off embedding for this video. Use “Open in browser”.',
153:'YouTube blocked the embed (Error 153).'};
if(!v){say('No video ID. Add ?v=VIDEOID to the address.');}
else{
  var s=document.createElement('script');
  s.src='https://www.youtube.com/iframe_api';
  s.onerror=function(){say('Could not load the YouTube player script.');};
  document.head.appendChild(s);
  window.onYouTubeIframeAPIReady=function(){
    new YT.Player('p',{
      width:'100%',height:'100%',videoId:v,
      playerVars:{autoplay:1,rel:0,playsinline:1,origin:location.origin},
      events:{
        onReady:function(){msg.style.display='none';},
        onError:function(e){say((errs[e.data]||'YouTube error '+e.data+'.'));}
      }
    });
  };
  setTimeout(function(){
    if(msg.style.display!=='none'){
      var c=(navigator.userAgent.match(/Chrome\/[\d.]+/)||['unknown'])[0];
      say('The player did not start. Browser engine: '+c+'. Use “Open in browser” as a backup.');
    }
  },9000);
}
</script></body></html>
